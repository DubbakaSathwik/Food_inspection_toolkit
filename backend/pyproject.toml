[project]
name = "crate-scan-backend"
version = "0.1.0"
description = "CRATE-SCAN FastAPI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pymongo>=4.11",
  "firebase-admin>=6.6",
  "httpx>=0.28",
  "pillow>=11.0",
  "numpy>=2.1",
  "reportlab>=4.2",
  "rapidfuzz>=3.10",
  "openpyxl>=3.1",
  "python-multipart>=0.0.18",
  "email-validator>=2.2",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.9", "paddlepaddle>=2.6"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "asgi-lifespan>=2.1",
  "ruff>=0.8",
  "mypy>=1.13",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "pypdf>=5.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012", "RUF001", "RUF002", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC", "E501"]
"migrations/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.pycodestyle]
max-line-length = 140

[tool.bandit]
skips = ["B101"]
