# CRATE-SCAN CI/CD (master prompt §11, owner decision F1: auto-deploy from main after CI passes).
# quality → tests → security/codeql → build → deploy (main only) → smoke.
# Required GitHub secrets for deploy (Settings → Secrets and variables → Actions, environment "production"):
#   RENDER_DEPLOY_HOOK_URL, NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
# Required repository/environment variables: API_BASE_URL (Render URL), SITE_URL (Netlify URL),
#   NEXT_PUBLIC_FIREBASE_API_KEY, NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN, NEXT_PUBLIC_FIREBASE_PROJECT_ID, NEXT_PUBLIC_FIREBASE_APP_ID
# See docs/DEPLOYMENT.md.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  FIREBASE_TOOLS_VERSION: "14.27.0"

jobs:
  quality:
    name: Quality (lint, format, types)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Backend lint, format, types
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
      - name: OpenAPI types are up to date
        working-directory: backend
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code -- openapi.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend lint, format, types
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm gen:api && git diff --exit-code -- src/lib/api-types.ts
          pnpm lint
          pnpm format:check
          pnpm typecheck

  tests:
    name: Tests (pytest, Vitest, Playwright)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Start Firebase Auth emulator
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          npm install -g "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          nohup firebase emulators:start --only auth --project demo-cratescan > emulator.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf 127.0.0.1:9099/ >/dev/null && exit 0; sleep 2; done
          cat emulator.log; exit 1
      - name: Migrations apply cleanly twice (idempotent)
        working-directory: backend
        env:
          APP_ENV: test
          MONGODB_URI: mongodb://localhost:27017/?directConnection=true
          MONGODB_DB_NAME: crate_scan_migrations
          FIREBASE_PROJECT_ID: demo-cratescan
          SUPER_ADMIN_EMAIL: root@example.com
        run: |
          uv sync --frozen
          uv run python -m scripts.migrate
          uv run python -m scripts.migrate
      - name: Backend tests with coverage
        working-directory: backend
        run: uv run pytest -q --cov=app --cov-report=term --cov-report=xml --cov-fail-under=85
      - name: Frontend unit tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: Start API and web for end-to-end tests
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-cratescan.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-cratescan
          NEXT_PUBLIC_FIREBASE_APP_ID: demo-app
          NEXT_PUBLIC_USE_AUTH_EMULATOR: "true"
          NEXT_PUBLIC_AUTH_EMULATOR_URL: http://127.0.0.1:9099
        run: |
          (cd frontend && pnpm build)
          bash scripts/ci-stack.sh
      - name: Playwright (desktop + mobile)
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --trace retain-on-failure
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-artifacts
          retention-days: 7
          path: |
            frontend/playwright-report/
            frontend/test-results/
            .local-logs/
            emulator.log
            backend/coverage.xml

  security:
    name: Security (secrets, dependencies, SAST, DAL rule)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks, full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Python dependency audit (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx --from "pip-audit==2.10.0" pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
      - name: Python SAST (Bandit)
        working-directory: backend
        run: |
          uv sync --frozen
          uv run bandit -q -c pyproject.toml -r app scripts
      - name: Data-access-layer rule (routers never touch MongoDB)
        working-directory: backend
        env:
          APP_ENV: test
          FIREBASE_PROJECT_ID: demo-cratescan
        # Static checks only: skip conftest (its session fixture needs MongoDB, which this job does not run).
        run: uv run pytest -q -p no:cacheprovider --noconftest tests/test_architecture.py --no-cov
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: JavaScript dependency audit (high/critical)
        working-directory: frontend
        run: pnpm audit --audit-level high

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  build:
    name: Build (frontend bundle + backend start check)
    needs: [tests, security, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Production frontend build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://example.invalid' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'ci-placeholder' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'ci.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'ci-project' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || 'ci-app' }}
          NEXT_PUBLIC_USE_AUTH_EMULATOR: "false"
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Bundle secret scan
        run: bash scripts/scan-bundle.sh frontend/.next
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Backend start check (Render start command, production settings)
        working-directory: backend
        env:
          PORT: "8123"
          APP_ENV: production
          MONGODB_URI: mongodb://localhost:27017/?directConnection=true
          MONGODB_DB_NAME: crate_scan_startcheck
          FIREBASE_PROJECT_ID: demo-cratescan
          SUPER_ADMIN_EMAIL: root@example.com
          CORS_ALLOWED_ORIGINS: https://example.invalid
          AI_PROVIDER_ORDER: gemini,nvidia,huggingface
        run: |
          uv sync --frozen --no-dev
          uv run python -m scripts.migrate
          nohup uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port "$PORT" --proxy-headers > start.log 2>&1 &
          for _ in $(seq 1 45); do curl -sf "localhost:$PORT/health" && break; sleep 2; done
          curl -sf "localhost:$PORT/health" || { cat start.log; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:$PORT/docs")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:$PORT/api/v1/me")" = 401

  deploy:
    name: Deploy (Render backend → Netlify frontend)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trigger Render deploy and wait for /health
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" && test -n "$API_BASE_URL" || { echo "::error::Set RENDER_DEPLOY_HOOK_URL secret and API_BASE_URL variable"; exit 1; }
          curl -sf -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          sleep 60
          # Free instances cold-start; a build + start can take several minutes.
          for _ in $(seq 1 60); do
            if curl -sf --max-time 30 "$API_BASE_URL/health"; then echo; exit 0; fi
            sleep 15
          done
          echo "::error::Backend did not become healthy"; exit 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build and deploy frontend to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_USE_AUTH_EMULATOR: "false"
        run: |
          (cd frontend && pnpm install --frozen-lockfile)
          npx --yes netlify-cli@27.20.0 deploy --build --prod --no-build-cache --message "CI ${GITHUB_SHA::7}"
          bash scripts/scan-bundle.sh frontend/.next

  smoke:
    name: Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Site, API health, CORS and security headers
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -e
          curl -sf --max-time 30 "$SITE_URL/" -o /dev/null
          curl -sfI --max-time 30 "$SITE_URL/" | grep -i "x-frame-options: deny"
          curl -sf --max-time 60 "$API_BASE_URL/health" | grep '"status":"ok"'
          curl -sf --max-time 30 "$API_BASE_URL/api/v1/public/site-images" -H "Origin: $SITE_URL" -D - -o /dev/null | grep -i "access-control-allow-origin: $SITE_URL"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API_BASE_URL/api/v1/me")
          test "$code" = "401" || { echo "::error::/api/v1/me without a token returned $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API_BASE_URL/docs")
          test "$code" = "404" || { echo "::error::API docs are exposed in production ($code)"; exit 1; }
          echo "Smoke test passed"
