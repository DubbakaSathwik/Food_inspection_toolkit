# Weekly security re-scan of main (new CVEs appear without code changes) + optional production health check.
# The health check runs once a week only: it is NOT a keep-alive. Render free instances spin down after
# 15 idle minutes by design; we accept the cold start (UI shows "Starting the server…", T-26).
name: Scheduled security

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scheduled
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks, full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Python dependency audit
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx --from "pip-audit==2.10.0" pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: JavaScript dependency audit (high/critical)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  health:
    if: vars.API_BASE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Production health (allows for a cold start)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          for _ in $(seq 1 6); do curl -sf --max-time 60 "$API_BASE_URL/health" && exit 0; sleep 20; done
          echo "::error::Production backend is not healthy"; exit 1
