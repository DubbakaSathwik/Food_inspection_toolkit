# Render Blueprint for CRATE-SCAN — everything on Render (DECISIONS T-40, replaces Netlify B1).
#   crate-scan-api  FastAPI backend (Python)        crate-scan-web  Next.js frontend (Node)
# Both deploy automatically from `main`, but only after the GitHub Actions checks pass (autoDeployTrigger: checksPass).
# Values marked `sync: false` are asked for once in the Render dashboard; secrets never live in Git.
# Step-by-step: docs/DEPLOYMENT.md
services:
  - type: web
    name: crate-scan-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install "uv==0.11.32" && uv sync --frozen --no-dev && .venv/bin/python -m scripts.migrate
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: UV_PROJECT_ENVIRONMENT
        value: .venv
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: crate_scan
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      # Exact address of the website below (change it if Render gave the site a different name).
      - key: CORS_ALLOWED_ORIGINS
        value: https://crate-scan-web.onrender.com
      - key: AI_PROVIDER_ORDER
        value: gemini,nvidia
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: OCR_ENABLED
        value: "false"
      # Render's chain is client -> Cloudflare -> Render edge -> internal proxy -> app, so the real client is the 3rd
      # entry from the right of X-Forwarded-For (measured with Admin -> Diagnostics -> Client address; SEC-003).
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      - key: RATE_LIMIT_DEFAULT
        value: 240/minute
      - key: RATE_LIMIT_WRITE
        value: 60/minute
      - key: RATE_LIMIT_AI
        value: 12/minute

  - type: web
    name: crate-scan-web
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 build
    startCommand: ./node_modules/.bin/next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Browser-visible settings (public by design). The API address is baked in at build time.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://crate-scan-api.onrender.com
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_USE_AUTH_EMULATOR
        value: "false"
