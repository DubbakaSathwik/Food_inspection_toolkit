# Netlify (B1) — Next.js frontend in /frontend. Builds are triggered by GitHub Actions (F1), not by Netlify Git hooks.
[build]
  base = "frontend"
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Next.js inline bootstrap scripts and the design's inline styles need 'unsafe-inline' (no nonce pipeline yet).
    # connect-src: the Render API + Firebase Auth endpoints. frame-src: Firebase sign-in popup/redirect helper.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.onrender.com https://lh3.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://*.onrender.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
