<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#56703a"/></marker><marker id="ahs" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto"><path d="M11,1 L1,6 L11,11 z" fill="#56703a"/></marker></defs>
<rect width="1700" height="760" fill="#fbf8f0"/>
<text x="40" y="52" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="30" font-weight="800" fill="#3e5228" text-anchor="start">Inspection workflow</text>
<rect x="40" y="130" width="245" height="210" rx="18" fill="#e3eacf" stroke="#56703a" stroke-width="1.8"/>
<circle cx="74" cy="166" r="0" fill="#56703a"/>
<text x="60" y="172" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="18" font-weight="800" fill="#3e5228" text-anchor="start">1  Photographs</text>
<text x="60" y="208.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">Up to 5 photos,</text>
<text x="60" y="229.025" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">front / back / sides,</text>
<text x="60" y="250.05" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">quality check</text>
<line x1="285" y1="235" x2="315" y2="235" stroke="#56703a" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="315" y="130" width="245" height="210" rx="18" fill="#ffffff" stroke="#56703a" stroke-width="1.8"/>
<circle cx="349" cy="166" r="0" fill="#56703a"/>
<text x="335" y="172" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="18" font-weight="800" fill="#3e5228" text-anchor="start">2  AI reading</text>
<text x="335" y="208.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">22 label fields with</text>
<text x="335" y="229.025" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">confidence per field</text>
<text x="335" y="250.05" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">(Gemini → NVIDIA → OCR)</text>
<line x1="560" y1="235" x2="590" y2="235" stroke="#56703a" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="590" y="130" width="245" height="210" rx="18" fill="#e3eacf" stroke="#56703a" stroke-width="1.8"/>
<circle cx="624" cy="166" r="0" fill="#56703a"/>
<text x="610" y="172" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="18" font-weight="800" fill="#3e5228" text-anchor="start">3  Verify fields</text>
<text x="610" y="208.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">Confirm or correct;</text>
<text x="610" y="229.025" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">format checks (FSSAI,</text>
<text x="610" y="250.05" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">dates, EAN, quantity)</text>
<line x1="835" y1="235" x2="865" y2="235" stroke="#56703a" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="865" y="130" width="245" height="210" rx="18" fill="#ffffff" stroke="#56703a" stroke-width="1.8"/>
<circle cx="899" cy="166" r="0" fill="#56703a"/>
<text x="885" y="172" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="18" font-weight="800" fill="#3e5228" text-anchor="start">4  Analysis</text>
<text x="885" y="208.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">Match reference record,</text>
<text x="885" y="229.025" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">apply compliance rules,</text>
<text x="885" y="250.05" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">compare packaging</text>
<line x1="1110" y1="235" x2="1140" y2="235" stroke="#56703a" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="1140" y="130" width="245" height="210" rx="18" fill="#e3eacf" stroke="#56703a" stroke-width="1.8"/>
<circle cx="1174" cy="166" r="0" fill="#56703a"/>
<text x="1160" y="172" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="18" font-weight="800" fill="#3e5228" text-anchor="start">5  Findings</text>
<text x="1160" y="208.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">Accept, dismiss or</text>
<text x="1160" y="229.025" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">correct each finding</text>
<text x="1160" y="250.05" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">with a note</text>
<line x1="1385" y1="235" x2="1415" y2="235" stroke="#56703a" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="1415" y="130" width="245" height="210" rx="18" fill="#ffffff" stroke="#56703a" stroke-width="1.8"/>
<circle cx="1449" cy="166" r="0" fill="#56703a"/>
<text x="1435" y="172" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="18" font-weight="800" fill="#3e5228" text-anchor="start">6  Decision &amp; report</text>
<text x="1435" y="208.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">Verified / not verified /</text>
<text x="1435" y="229.025" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">suspicious; 13-section PDF;</text>
<text x="1435" y="250.05" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">originals deleted</text>
<rect x="300" y="420" width="570" height="150" rx="16" fill="#fbefd9" stroke="#d9b779" stroke-width="1.6"/>
<text x="322" y="456" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="17" font-weight="800" fill="#7a4808" text-anchor="start">If every AI provider fails</text>
<text x="322" y="488.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#20231d" text-anchor="start">Photos are saved; the inspection is marked incomplete.</text>
<text x="322" y="509.025" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#20231d" text-anchor="start">Inspector can retry now or later, or change photos.</text>
<text x="322" y="530.05" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#20231d" text-anchor="start">Optional offline OCR gives low-confidence draft fields.</text>
<line x1="590" y1="340" x2="590" y2="420" stroke="#7a4808" stroke-width="2.4" marker-end="url(#ah)"/>
<text x="640" y="392" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#55584e" text-anchor="middle">AI error</text>
<rect x="950" y="420" width="710" height="150" rx="16" fill="#e2e8ee" stroke="#a9bccd" stroke-width="1.6"/>
<text x="972" y="456" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="17" font-weight="800" fill="#2f4a63" text-anchor="start">Human stays in control</text>
<text x="972" y="488.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#20231d" text-anchor="start">AI only suggests: every field and finding is confirmed by the inspector.</text>
<text x="972" y="509.025" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#20231d" text-anchor="start">Final classification is the inspector&#x27;s decision; the report says so.</text>
<text x="972" y="530.05" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#20231d" text-anchor="start">Reference records and rules are labelled DEMO data.</text>
<line x1="1300" y1="340" x2="1300" y2="420" stroke="#2f4a63" stroke-width="2.4" marker-end="url(#ah)"/>
<text x="1390" y="392" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#55584e" text-anchor="middle">decision support only</text>
<rect x="40" y="620" width="1620" height="90" rx="16" fill="#e3eacf" stroke="#56703a" stroke-width="1.6"/>
<text x="70" y="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="17" font-weight="800" fill="#3e5228" text-anchor="start">Retention</text>
<text x="70" y="686" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#55584e" text-anchor="start">Originals stay in GridFS only until the report is generated, then they are deleted; abandoned inspections are cleaned up after the retention period. Only compressed copies live inside the PDF.</text>
</svg>